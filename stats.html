<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PDflow 使用统计</title>
<style>
:root{--bg:#fbfcfd;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--card:#fff;--accent:#111827;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=password]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
label.small{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-size:26px;line-height:1.2}
.tile span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.msg{font-size:13px;color:var(--muted);margin-top:8px}
.err{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>PDflow 使用统计</h1>
  <p class="sub">只显示次数,不包含文件名、文件内容或访客信息。后端服务每次重启或部署后,数据会从零开始。</p>

  <div class="card">
    <form class="row" id="f" autocomplete="off">
      <input type="password" id="key" placeholder="输入统计密钥" aria-label="统计密钥">
      <button type="submit" id="go">查看</button>
    </form>
    <label class="small" style="margin-top:10px"><input type="checkbox" id="remember"> 在这个浏览器里记住密钥</label>
    <div class="msg" id="msg"></div>
  </div>

  <div id="out" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="card scroll"><table id="tbl"></table></div>
    <div class="note" id="since"></div>
  </div>
</div>

<script>
const API='https://web-production-41e20.up.railway.app';
const $=id=>document.getElementById(id);
const LABELS={uploads:'上传',sample_uploads:'其中示例',own_uploads:'其中自己的文件',result_ready:'成功',result_review:'需复核',result_no_output:'无输出',result_error:'失败',downloads:'下载'};
const ORDER=['uploads','sample_uploads','own_uploads','result_ready','result_review','result_no_output','result_error','downloads'];
function label(k){return LABELS[k]||k}
function lsGet(){try{return localStorage.getItem('pdflow_stats_key')||''}catch(e){return ''}}
function lsSet(v){try{v?localStorage.setItem('pdflow_stats_key',v):localStorage.removeItem('pdflow_stats_key')}catch(e){}}

function render(data){
  const days=Object.keys(data.days||{}).sort().reverse();
  const rows=days.map(d=>{const c=Object.assign({},data.days[d]);c.own_uploads=(c.uploads||0)-(c.sample_uploads||0);return [d,c]});
  const total={};
  rows.forEach(r=>Object.keys(r[1]).forEach(k=>total[k]=(total[k]||0)+r[1][k]));
  const extra=Object.keys(total).filter(k=>ORDER.indexOf(k)<0);
  const show=ORDER.concat(extra);
  $('tiles').innerHTML='';
  ['uploads','own_uploads','result_ready','downloads'].forEach(k=>{
    const t=document.createElement('div');t.className='tile';
    const b=document.createElement('b');b.textContent=total[k]||0;
    const s=document.createElement('span');s.textContent=label(k)+'(合计)';
    t.append(b,s);$('tiles').appendChild(t);
  });
  const tbl=$('tbl');tbl.innerHTML='';
  const head=document.createElement('tr');
  const th0=document.createElement('th');th0.textContent='日期(UTC)';head.appendChild(th0);
  show.forEach(k=>{const th=document.createElement('th');th.textContent=label(k);head.appendChild(th)});
  tbl.appendChild(head);
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    const td0=document.createElement('td');td0.textContent=r[0];tr.appendChild(td0);
    show.forEach(k=>{const td=document.createElement('td');td.textContent=r[1][k]||0;tr.appendChild(td)});
    tbl.appendChild(tr);
  });
  if(!rows.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=show.length+1;td.textContent='自上次服务启动以来还没有数据。';tr.appendChild(td);tbl.appendChild(tr)}
  let since=data.since_utc;
  try{since=new Date(data.since_utc).toLocaleString('zh-CN',{hour12:false})+'(你的本地时间)'}catch(e){}
  $('since').textContent='计数从 '+since+' 开始。服务每次重启或部署后会清零。';
  $('out').hidden=false;
}

async function load(key){
  const msg=$('msg');msg.className='msg';msg.textContent='读取中…';$('go').disabled=true;
  try{
    const r=await fetch(API+'/stats?key='+encodeURIComponent(key));
    if(r.status===404){throw new Error('密钥不对,或统计功能没有开启。')}
    if(!r.ok){throw new Error('服务暂时没有响应('+r.status+'),稍后再试。')}
    const data=await r.json();
    render(data);msg.textContent='已更新:'+new Date().toLocaleTimeString('zh-CN',{hour12:false});
    lsSet($('remember').checked?key:'');
  }catch(err){
    $('out').hidden=true;msg.className='msg err';
    msg.textContent=(err instanceof TypeError)?'连不上后端服务,可能正在重启,稍后再试。':err.message;
  }finally{$('go').disabled=false}
}

$('f').addEventListener('submit',e=>{e.preventDefault();const k=$('key').value.trim();if(k)load(k)});
const saved=lsGet();
if(saved){$('key').value=saved;$('remember').checked=true;load(saved)}
</script>
</body>
</html>
